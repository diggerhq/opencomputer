# Rendered by apply.sh. Placeholders: __APP__, __FLY_REGION__, __DECOY__, __POLICY_URL__.
app = "__APP__"
primary_region = "__FLY_REGION__"

[env]
  REALITY_DECOY = "__DECOY__"
  # Empty: no polling, only the EGRESS_POLICY secret.
  EGRESS_POLICY_URL = "__POLICY_URL__"

# Raw TCP passthrough (no handlers, so Fly does not terminate TLS). Needs a
# dedicated IPv4. 8443 is a spare for networks that intercept 443 by SNI.
[[services]]
  protocol = "tcp"
  internal_port = 443
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443

  [[services.ports]]
    port = 8443

  # Fly connects and drops; Xray logs "REALITY: processed invalid connection". Harmless.
  [[services.tcp_checks]]
    interval = "30s"
    timeout = "3s"
    grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
