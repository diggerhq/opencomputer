syntax = "proto3";

package opencomputer.edge.v1;

message ExecRequest {
  uint32 request_id = 1;
  string command = 2;
  string cwd = 3;
  uint32 timeout_ms = 4;
  map<string, string> env = 5;
}

message ExecResult {
  uint32 request_id = 1;
  sint32 exit_code = 2;
  uint32 duration_ms = 3;
  bytes stdout = 4;
  bytes stderr = 5;
  string error = 6;
}
