# api-edge Worker — global API entry point at app.opencomputer.dev / app.dev.opensandbox.ai
#
# Routes:
#   POST /auth/login, /auth/refresh, /auth/logout — WorkOS flow + session JWT
#   POST /webhooks/stripe                          — Stripe webhook (DO /mark-pro)
#   POST /api/sandboxes                            — create flow (auth + credit check + cell select + cap-token mint + proxy to CP)
#   GET  /api/sandboxes                            — cross-region list (D1 sandboxes_index)
#   GET  /api/sandboxes/{id}                       — metadata with cell_endpoint
#   ANY  /api/sandboxes/{id}/*                     — 307 redirect to {cell_id}.app.opensandbox.ai (dumb-client fallback)
#   GET  /internal/halt-list                       — HMAC-auth, called by CP halt_reconciler

name = "opensandbox-edge-dev"
main = "src/index.ts"
compatibility_date = "2026-04-28"
compatibility_flags = ["nodejs_compat"]
account_id = "1241f114453e32d292197e3fb36210b2"

# Preview URL routing. Sandboxes expose ports via stable hostnames of the form
#   sb-{sandboxID}-p{port}.sb.opensandbox.ai
# regardless of which cell the sandbox is on; the Worker resolves
# sandboxes_index.cell_id at request time and forwards via that cell's CF
# Tunnel, so cell migration is invisible to the user.
#
# Wildcards in CF Worker routes must be at the start of the hostname, so
# `sb-*.opensandbox.ai/*` is invalid. We use `*.sb.opensandbox.ai/*` instead:
# the `.sb.` middle label creates a namespace that ONLY preview URLs use,
# isolating this rule from cp-*.opensandbox.ai (tunnels), app2.opensandbox.ai
# (dashboard), and events-app2.opensandbox.ai (events-ingest).
#
# Two-level wildcards aren't covered by CF Universal SSL — needs Advanced
# Certificate Manager ($10/mo, RSA-2048 via Google Trust Services). Cert
# ordered 2026-05-18 for *.sb.opensandbox.ai + sb.opensandbox.ai.
routes = [
  { pattern = "*.sb.opensandbox.ai/*", zone_name = "opensandbox.ai" },
  # Pinned so `wrangler delete && wrangler deploy` (the branch-swap reset
  # workflow) always re-attaches this hostname. custom_domain=true tells CF to
  # manage the DNS record + SSL cert automatically — different from a plain
  # worker route, which would need a separate DNS entry that survives delete.
  { pattern = "app2.opensandbox.ai", zone_name = "opensandbox.ai", custom_domain = true },
]

# Static assets — the dashboard SPA. Built from `web/` by the deploy script
# (web/dist/ → cloudflare-workers/api-edge/assets/). The Worker handles
# explicit API/auth/webhook paths; anything else falls through to the SPA's
# index.html so client-side routing works.
[assets]
directory = "./assets"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Run Worker first for EVERY request. The Worker dispatches by hostname
# (e.g. sb-*-p*.sb.opensandbox.ai → preview URL forwarder) AND by path
# (/api/*, /auth/*, /internal/*), then explicitly delegates to env.ASSETS
# at the bottom for anything unhandled — typically the dashboard SPA. Without
# this, the assets binding short-circuits hostname-based dispatch and returns
# index.html for / on every hostname, including preview URLs.
run_worker_first = true

[[d1_databases]]
binding = "OPENCOMPUTER_DB"
database_name = "opencomputer-dev"
database_id = "f9e534bf-a9f3-4b30-81cd-f9eb9087e96d"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "694f22abd551461da4ad99839f161b2f"

[[ratelimits]]
name = "CLI_AUTH_START_RATE_LIMIT"
namespace_id = "2026072421"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "CLI_AUTH_EXCHANGE_RATE_LIMIT"
namespace_id = "2026072422"

  [ratelimits.simple]
  limit = 180
  period = 60

[[durable_objects.bindings]]
name = "CREDIT_ACCOUNT"
class_name = "CreditAccount"
script_name = "opensandbox-edge-dev"

# Edge claim (src/pool_stock.ts): per-cell stock of pre-reserved hot pool
# boxes so default-shape creates are answered at the edge. Kill switch:
# EDGE_CLAIM = "0" in [vars].
[[durable_objects.bindings]]
name = "POOL_STOCK"
class_name = "PoolStock"
script_name = "opensandbox-edge-dev"

# VM-DO exec data plane (vm_do_datapane_validation): one DO per sandbox holds
# the host-dialed WebSocket to the QEMU worker. The class lives in the separate
# vm-do worker (cloudflare-workers/vm-do) so edge deploys — which happen on
# every merge touching web/ or edge code — don't reset the DOs and sever the
# sockets. Deploy order on first cutover: vm-do worker BEFORE this one.
[[durable_objects.bindings]]
name = "VM_SESSIONS"
class_name = "VmSession"
script_name = "opensandbox-vmdo-dev"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CreditAccount"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PoolStock"]

# v3 adds the VmSession DO class (VM-DO exec data plane). Sits after PoolStock's
# v2 to match the deployed ledger — do not renumber.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["VmSession"]

# v4 removes the edge-local VmSession class — it moved to the vm-do worker
# (see the VM_SESSIONS binding above). Safe to delete: VmSession keeps no
# durable state, only live sockets, and hosts redial the new namespace within
# ~1s of the cutover deploy.
[[migrations]]
tag = "v4"
deleted_classes = ["VmSession"]

# Secrets (set via `wrangler secret put`):
#   SESSION_JWT_SECRET     — HMAC for session JWT (shared with all CPs in cell fleet)
#   CF_ADMIN_SECRET        — HMAC for /admin/halt-org and /admin/resume-org callbacks to CPs
#   STRIPE_WEBHOOK_SECRET  — verifies inbound Stripe webhook signatures
#   STRIPE_API_KEY         — for creating Stripe customer + subscription on /mark-pro
#   WORKOS_API_KEY         — server-side WorkOS API for /auth/login
#   WORKOS_CLIENT_ID       — WorkOS client identifier
#   EVENT_SECRET           — HMAC for /internal/halt-list endpoint (shared with CP halt_reconciler)
#   OPENROUTER_PROVISIONING_KEY — OpenRouter MANAGEMENT/provisioning key (token
#                            billing; mints per-org keys + reads analytics). Dormant
#                            until set. See .agents/work/token-billing.md.
#   OC_MANAGED_CRED_HMAC_SECRET — dedicated HMAC for the minted-OR-key hand-off to
#                            sessions-api (shared only with sessions-api).
#   OC_SECURITY_NOTIFICATION_SECRET — dedicated HMAC for minimal Agent Hook
#                            exposure alerts from sessions-api.
#   OC_MANAGED_AGENTS_SECRET — dedicated HS256 secret shared only with the
#                            managed-agents backend.
# The VM-DO exec data plane (VM_SESSIONS DO) needs NO dedicated secret: the worker
# host authenticates its /internal/vms/:id/connect dial with a per-sandbox HMAC
# over the already-shared SESSION_JWT_SECRET (minted by the CP, re-derived here).
# Optional vars: OPENROUTER_BASE_URL (default https://openrouter.ai/api/v1),
#   OPENROUTER_MARKUP_BPS (env-default markup; per-org orgs.model_markup_bps wins).

# Edge-native autumn billing: every 5 min, meter autumn orgs' usage_samples to
# Autumn + halt on exhaustion (src/autumn_meter.ts). One place, not per-cell.
# No-ops unless AUTUMN_SECRET_KEY is set, so it's dormant until cutover.
[triggers]
crons = ["*/5 * * * *"]

[vars]
WORKER_ENV = "dev"
# Dev override of the per-org paused-sandbox cap (prod defaults to 100) so the
# promotion path can be exercised without pausing hundreds of boxes.
PAUSED_CAP = "10"
# PoolStock sizing, scaled to THIS cell's pool. The DO defaults (38 per shard ×
# 8 shards = 304) are sized for prod's 320-box pool. Oversizing starves every
# shard below low-water, restocking on every claim and competing for a supply
# that can never satisfy them; undersizing caps how much of a burst the edge can
# absorb, because anything past SHARDS × TARGET falls through to the ~10× slower
# CP path. See the SIZING INVARIANT in src/pool_stock.ts.
#
# 8 × 18 = 144 against dev's 150-box MicroVM pool. Sized for the burst-100
# benchmark with ~44 boxes of headroom, and that headroom is the whole point:
# 8 × 14 = 112 against a 130-box pool looked like it covered a burst-100 and did
# not. Measured, twice: shards probed SEQUENTIALLY reported 12-13 of 14 each
# (~104 staged, apparently enough), yet 51 then 65 of 100 concurrent creates
# missed the magazine and fell through to a cold MicroVM launch — which then
# serialized behind the RunMicrovm 5/s quota into a 25s tail.
#
# The reason a 4-box margin is not a margin: `magazines` in index.ts is an
# ISOLATE-LOCAL map. A 100-wide burst lands across several isolates, each with
# its own magazine, its own waiter count, and its own refill fan-out, all
# drawing on the same staged stock without coordinating. Whichever isolate
# refills last finds the shards drained, and behind them the pool has almost no
# free stock to backfill because the rest is already held as reservations. So
# the stock has to cover the burst with enough slack to survive an uneven split
# across SHARDS × isolates, not merely equal it.
#
# Why the pool can afford 150: a claimed box comes OUT of staged stock rather
# than being added alongside it, so peak footprint during the burst is the pool
# itself (~150), not pool + 100. Refill afterwards is what pushes toward
# pool + burst, and OPENSANDBOX_MICROVM_MAX_TOTAL_BOXES caps that at 230 —
# under the ~256-box ceiling the 1024GB regional quota actually allows (charged
# at roughly 4GB per box, not the image's 2048MiB minimum; measured by stalling
# the fleet at 262).
#
# Was 8 × 3 = 24, and the old value's reasoning does NOT carry over. On QEMU the
# ~30 was a fleet property: boxes live on provisioned workers, so growing the
# pool means growing the fleet. A MicroVM pool is just a dial — boxes launch in
# ~1.5s and depth is OPENSANDBOX_MICROVM_POOL_TARGET — so what actually bounds
# it is the AWS regional memory quota (~500 boxes at the 2048MB delivered size,
# shared with everything else in the account), not any fleet.
#
# What survives is only this: the edge reserves OUT of pool stock, so targeting
# more than the pool maintains starves every shard. Raise the pool first, then
# this. Measured before the change: burst-30 returned exactly 24 fast (90ms
# median) and dropped the remaining 6 to the CP.
POOL_STOCK_TARGET = "18"
POOL_STOCK_LOW_WATER = "9"
# Cells eligible for new-org home assignment are NOT configured here anymore —
# it's the `accepts_new_orgs` column on the D1 `cells` table (single source of
# truth, toggled per-row without a deploy). See pickHomeCell in src/index.ts.
# Optional alpha route for Burst Sandboxes. Leave empty to disable.
BURST_CELL_ID = ""
MANAGED_AGENTS_API_URL = "https://managedagents.opencomputer.dev"

# Ship console output + exceptions to opensandbox-log-tail, which forwards
# to Axiom dataset cf-dev. Keeps CF Worker logs durable in the same store
# as the VM journald stream so we can cross-correlate edge ↔ cell.
[[tail_consumers]]
service = "opensandbox-log-tail"

# Off-isolate edge-claim finalize (see FINALIZE_QUEUE in index.ts). Producer:
# createSandbox enqueues a tiny finalize message. Consumer: the queue() handler
# runs the CP claim-finalize + D1 insert on its own invocations, off the create
# hot path (which was the burst-create bottleneck).
[[queues.producers]]
binding = "FINALIZE_QUEUE"
queue = "edge-finalize-dev"

[[queues.consumers]]
queue = "edge-finalize-dev"
max_batch_size = 25
max_batch_timeout = 2
max_retries = 3
