# api-edge Worker — PROD on opencomputer.dev zone.
# Mirrors wrangler.toml (dev) but targets Mo's CF account.
# Deploy: `wrangler deploy -c wrangler.prod.toml`
#
# Final cutover hostname will be app.opencomputer.dev; during parallel run
# we serve at app2.opencomputer.dev so the legacy app at opencomputer.dev
# (opencomputer-site-v1 worker) keeps serving.

name = "opencomputer-edge-prod"
main = "src/index.ts"
compatibility_date = "2026-04-28"
compatibility_flags = ["nodejs_compat"]
account_id = "b8f23cb87a7a6c64040d3134643da448"

# The deployed version on computer-API telemetry (work 084). The optional
# TINYBIRD_API_URL and TINYBIRD_APPEND_TOKEN secrets switch it on; unset, the
# edge sends nothing.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Workers Logs: without this, exceptions behind a Cloudflare 1101 Ray ID are
# only visible to a live `wrangler tail`.
[observability]
enabled = true
head_sampling_rate = 1

# Static assets — the dashboard SPA. Built from `web/` by the deploy script.
[assets]
directory = "./assets"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "OPENCOMPUTER_DB"
database_name = "opencomputer-prod"
database_id = "8329e0f0-100d-445a-bf89-95c065f15dbb"
migrations_dir = "migrations"

# blue's managed-agent session index (session_creations), read by the activation
# alert (src/slack_alerts.ts, work 090). Read-only here: its schema and
# migrations belong to blue, so no migrations_dir.
[[d1_databases]]
binding = "SERVERLESS_AGENTS_DB"
database_name = "serverless-agents"
database_id = "dae08738-fc29-4ad3-acd1-138944aabc9e"

[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "b496f905ce634f94b6ac1d4f619825e0"

[[ratelimits]]
name = "CLI_AUTH_START_RATE_LIMIT"
namespace_id = "2026072401"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "CLI_AUTH_EXCHANGE_RATE_LIMIT"
namespace_id = "2026072402"

  [ratelimits.simple]
  limit = 180
  period = 60

# Public CLI connect (work 082): per IP, ahead of blue.
[[ratelimits]]
name = "COMPUTER_CONNECT_RATE_LIMIT"
namespace_id = "2026102301"

  [ratelimits.simple]
  limit = 20
  period = 60

# Computer API (work 084): HTTP calls per API key, ahead of blue.
[[ratelimits]]
name = "COMPUTER_API_RATE_LIMIT"
namespace_id = "2026102601"

  [ratelimits.simple]
  limit = 600
  period = 60

[[durable_objects.bindings]]
name = "CREDIT_ACCOUNT"
class_name = "CreditAccount"
script_name = "opencomputer-edge-prod"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CreditAccount"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PoolStock"]

# PoolStock is now an empty stub, kept exported because of v2; nothing binds it.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["VmSession"]

# v4 removes the edge-local VmSession class — it moved to the vm-do worker
# (cloudflare-workers/vm-do). Safe to delete: VmSession keeps no
# durable state, only live sockets, and hosts redial the new namespace within
# ~1s of the cutover deploy.
[[migrations]]
tag = "v4"
deleted_classes = ["VmSession"]

# Secrets (set via `wrangler secret put --config wrangler.prod.toml`):
#   SESSION_JWT_SECRET     — fresh prod HMAC (DO NOT reuse dev secret)
#   CF_ADMIN_SECRET        — fresh prod HMAC for the /internal/* admin routes
#   STRIPE_WEBHOOK_SECRET  — Stripe LIVE mode webhook signing secret
#   STRIPE_API_KEY         — Stripe LIVE mode API key (sk_live_...)
#   WORKOS_API_KEY         — prod WorkOS app API key
#   WORKOS_CLIENT_ID       — prod WorkOS client identifier
#   EVENT_SECRET           — fresh prod HMAC for /internal/autumn-* and
#                            /internal/webhooks/* callers
#   SECRET_ENCRYPTION_KEY  — envelope-encryption key for D1 secret_store_entries
#   OPENROUTER_PROVISIONING_KEY — OpenRouter MANAGEMENT/provisioning key (mints
#                            per-org inference keys + reads analytics). Token
#                            billing dormant until this is set. (token-billing.md)
#   OC_MANAGED_CRED_HMAC_SECRET — dedicated HMAC for handing a minted OR key to
#                            the managed agents backend (shared only with it; NOT the
#                            generic internal-auth — this route carries a live key)
#   BROWSER_API_SECRET     — shared with browser.opencomputer.dev for dashboard
#                            browser-session proxy requests
#   OC_MANAGED_AGENTS_SECRET — dedicated HS256 secret shared only with the
#                            managed-agents backend
#   AGENT_FEEDBACK_TRIAGE_TOKEN — bearer token for the feedback.now triage
#                            routes (src/agent_feedback.ts); submission works
#                            without it
#   LINEAR_API_KEY / LINEAR_TEAM_ID (+ optional LINEAR_PROJECT_ID var) —
#                            when set, each new agent-feedback report opens a
#                            Linear issue. Off when unset.
#   LOOPS_API_KEY          — lifecycle email through Loops (src/loops.ts,
#                            serverless-agents-ws 088). Off when unset.
#   LOOPS_EXCLUDE_EMAILS   — comma-separated addresses or @domains that never
#                            get lifecycle email (internal accounts).
# Optional vars: OPENROUTER_BASE_URL (default https://openrouter.ai/api/v1),
#   OPENROUTER_MARKUP_BPS (env-default markup; per-org orgs.model_markup_bps wins).

# Edge-native autumn billing: every 5 min, meter autumn orgs' usage_samples to
# Autumn + halt on exhaustion (src/autumn_meter.ts). One place, not per-cell.
# No-ops unless AUTUMN_SECRET_KEY is set, so it's dormant until cutover.
[triggers]
crons = ["*/5 * * * *"]

[vars]
WORKER_ENV = "prod"
# Computer rollout (work 052): only the organizations listed (comma-separated
# ids) see their computer until COMPUTER_ENABLED_FOR_ALL is "true".
COMPUTER_ENABLED_FOR_ALL = "true"
COMPUTER_ENABLED_ORGS = "be0cf06f-ef75-400a-851c-bfd1507a666e"
# Slack Connect per signup (slack_connect.ts): users created from 2026-10-28
# 00:00 UTC get a channel with utpal, Mo and Igor. Dormant until the
# SLACK_CONNECT_TOKEN secret is set.
SLACK_CONNECT_SINCE = "1793145600"
SLACK_CONNECT_TEAM_USER_IDS = "U06G42NTEK1,U06GFN8DJ7P,U06H7D98X40"
# Customer alerts (slack_alerts.ts, work 090), posted by the same Slack app
# (needs chat:write and membership of the channel). SLACK_ALERT_CHANNELS
# (`kind=channel,...`) moves a kind elsewhere, e.g. revenue alerts; credit
# purchases alert from SLACK_ALERT_CREDITS_MIN dollars (default 100).
SIGNUPS_SLACK_CHANNEL = "#signups"
MANAGED_AGENTS_API_URL = "https://managedagents.opencomputer.dev"

# Ship Worker logs to opencomputer-log-tail-prod → Axiom dataset cf-prod.
[[tail_consumers]]
service = "opencomputer-log-tail-prod"
