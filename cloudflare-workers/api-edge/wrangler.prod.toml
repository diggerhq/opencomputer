# api-edge Worker — PROD on opencomputer.dev zone.
# Mirrors wrangler.toml (dev) but targets Mo's CF account.
# Deploy: `wrangler deploy -c wrangler.prod.toml`
#
# Final cutover hostname will be app.opencomputer.dev; during parallel run
# we serve at app2.opencomputer.dev so the legacy app at opencomputer.dev
# (opencomputer-site-v1 worker) keeps serving.

name = "opencomputer-edge-prod"
main = "src/index.ts"
compatibility_date = "2026-04-28"
compatibility_flags = ["nodejs_compat"]
account_id = "b8f23cb87a7a6c64040d3134643da448"

# Preview URL routing — same scheme as dev (`*.sb.<zone>/*`).
# Requires an Advanced Certificate Manager cert for *.sb.opencomputer.dev
# + sb.opencomputer.dev (two-level wildcard isn't covered by Universal SSL).
# Order the ACM cert BEFORE the first deploy or the route will 525-error.
routes = [
  { pattern = "*.sb.opencomputer.dev/*", zone_name = "opencomputer.dev" },
]

# Static assets — the dashboard SPA. Built from `web/` by the deploy script.
[assets]
directory = "./assets"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "OPENCOMPUTER_DB"
database_name = "opencomputer-prod"
database_id = "8329e0f0-100d-445a-bf89-95c065f15dbb"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "b496f905ce634f94b6ac1d4f619825e0"

[[ratelimits]]
name = "CLI_AUTH_START_RATE_LIMIT"
namespace_id = "2026072401"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "CLI_AUTH_EXCHANGE_RATE_LIMIT"
namespace_id = "2026072402"

  [ratelimits.simple]
  limit = 180
  period = 60

[[durable_objects.bindings]]
name = "CREDIT_ACCOUNT"
class_name = "CreditAccount"
script_name = "opencomputer-edge-prod"

# Edge claim (src/pool_stock.ts): per-cell stock of pre-reserved hot pool boxes
# so default-shape creates are answered at the edge.
[[durable_objects.bindings]]
name = "POOL_STOCK"
class_name = "PoolStock"
script_name = "opencomputer-edge-prod"

# VM-DO exec data plane: one DO per sandbox holds the host-dialed WebSocket to
# the QEMU worker. The class lives in the separate vm-do worker
# (cloudflare-workers/vm-do → opencomputer-vmdo-prod) so edge deploys — which
# happen on every merge touching web/ or edge code — don't reset the DOs and
# sever the sockets. Deploy order on first cutover: vm-do worker BEFORE this.
[[durable_objects.bindings]]
name = "VM_SESSIONS"
class_name = "VmSession"
script_name = "opencomputer-vmdo-prod"

# MicroVM exec data plane. Same worker, same reasoning; the DO dials the box's
# AWS agent endpoint directly so exec never traverses the control plane.
#
# No migration accompanies this: MicrovmSession is defined in the vm-do script
# (see its wrangler.prod.toml v2), and a cross-script binding only references a
# class — it never creates one. Adding a migration here would try to define a
# second, unrelated MicrovmSession inside the edge script.
#
# The edge guards every use with `env.MICROVM_SESSIONS &&`, so prod ran without
# this binding rather than erroring — it silently skipped the detach-on-destroy
# that stops the DO's keepalive alarm re-dialing a terminated box.
[[durable_objects.bindings]]
name = "MICROVM_SESSIONS"
class_name = "MicrovmSession"
script_name = "opencomputer-vmdo-prod"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CreditAccount"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PoolStock"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["VmSession"]

# v4 removes the edge-local VmSession class — it moved to the vm-do worker
# (see the VM_SESSIONS binding above). Safe to delete: VmSession keeps no
# durable state, only live sockets, and hosts redial the new namespace within
# ~1s of the cutover deploy.
[[migrations]]
tag = "v4"
deleted_classes = ["VmSession"]

# Secrets (set via `wrangler secret put --config wrangler.prod.toml`):
#   SESSION_JWT_SECRET     — fresh prod HMAC (DO NOT reuse dev secret)
#   CF_ADMIN_SECRET        — fresh prod HMAC, shared with prod CPs
#   STRIPE_WEBHOOK_SECRET  — Stripe LIVE mode webhook signing secret
#   STRIPE_API_KEY         — Stripe LIVE mode API key (sk_live_...)
#   WORKOS_API_KEY         — prod WorkOS app API key
#   WORKOS_CLIENT_ID       — prod WorkOS client identifier
#   EVENT_SECRET           — fresh prod HMAC, shared with prod CPs + events-ingest
#   SECRET_ENCRYPTION_KEY  — envelope-encryption key for D1 secret_store_entries
#                            (must match Infisical /shared/ key the CPs use, so
#                            plaintext stays in sync across edge ↔ cells)
#   OPENROUTER_PROVISIONING_KEY — OpenRouter MANAGEMENT/provisioning key (mints
#                            per-org inference keys + reads analytics). Token
#                            billing dormant until this is set. (token-billing.md)
#   OC_MANAGED_CRED_HMAC_SECRET — dedicated HMAC for handing a minted OR key to
#                            sessions-api (shared only with sessions-api; NOT the
#                            generic internal-auth — this route carries a live key)
#   OC_SECURITY_NOTIFICATION_SECRET — dedicated HMAC for minimal Agent Hook
#                            exposure alerts from sessions-api
#   BROWSER_API_SECRET     — shared with browser.opencomputer.dev for dashboard
#                            browser-session proxy requests
#   OC_MANAGED_AGENTS_SECRET — dedicated HS256 secret shared only with the
#                            managed-agents backend
# Optional vars: OPENROUTER_BASE_URL (default https://openrouter.ai/api/v1),
#   OPENROUTER_MARKUP_BPS (env-default markup; per-org orgs.model_markup_bps wins).

# Edge-native autumn billing: every 5 min, meter autumn orgs' usage_samples to
# Autumn + halt on exhaustion (src/autumn_meter.ts). One place, not per-cell.
# No-ops unless AUTUMN_SECRET_KEY is set, so it's dormant until cutover.
[triggers]
crons = ["*/5 * * * *"]

[vars]
WORKER_ENV = "prod"
# PoolStock sizing. SHARDS × TARGET must stay ≤ the cell's MicroVM pool
# (OPENSANDBOX_MICROVM_POOL_TARGET on the CP) or every shard sits permanently
# below low-water, restocks on every claim, and competes for a supply that can
# never satisfy it — creates then fall through to the ~10× slower CP path.
#
# 8 × 18 = 144 against prod's pool of 150. These were unset until 2026-08-20,
# which meant the DO defaults (38 per shard = 304 fleet) applied against a pool
# of 5 — every shard starved and edge-claim effectively never hit. Raise the CP
# pool target FIRST, then this. See the SIZING INVARIANT in src/pool_stock.ts.
POOL_STOCK_TARGET = "18"
POOL_STOCK_LOW_WATER = "9"
# Stated explicitly rather than inherited from the code default, because a shard
# id is half of a DO NAME (`${cellID}#${gen}#${id}`) and therefore names a
# different object — with different placement — in every cell. Sharing one
# implicit list across environments silently asserted that prod's IAD placement
# measurement also held for dev. It does not; dev now runs a single shard.
#
# These four are the prefix of the g5 set probed into IAD against THIS cell on
# 2026-08-21. Do not extend without re-probing: of 64 candidates, only 27 landed
# in IAD (EWR 17, ATL 9, MIA 7, ORD 4). No change in behaviour from before —
# this is what the code default already resolved to.
POOL_STOCK_SHARD_IDS = "1,4,6,12"
# Cells eligible for new-org home assignment live in the D1 `cells` table
# (`accepts_new_orgs` column), not an env list — toggle a row to onboard a cell,
# no deploy. See pickHomeCell in src/index.ts.
# Optional alpha route for Burst Sandboxes. Leave empty to disable.
BURST_CELL_ID = "aws-us-east-2-burst-prod"
MANAGED_AGENTS_API_URL = "https://managedagents.opencomputer.dev"

# Ship Worker logs to opencomputer-log-tail-prod → Axiom dataset cf-prod.
[[tail_consumers]]
service = "opencomputer-log-tail-prod"

# Off-isolate edge-claim finalize (see FINALIZE_QUEUE in index.ts). createSandbox
# enqueues a tiny finalize message; the queue() consumer runs the CP
# claim-finalize + D1 insert on its own invocations, off the burst-create hot
# path. PREREQ: the queue must exist before deploy — `wrangler queues create
# edge-finalize` on the prod account (one-time). Inline fallback in code covers
# any window where it's unbound.
[[queues.producers]]
binding = "FINALIZE_QUEUE"
queue = "edge-finalize"

[[queues.consumers]]
queue = "edge-finalize"
max_batch_size = 25
max_batch_timeout = 2
max_retries = 3
