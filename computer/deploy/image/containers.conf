# Podman inside a session (work 103, C11): the settings of the official
# Podman-in-Podman image (containers/image_build, podman/containers.conf, read
# 2026-11-12). Inner containers share the session's network and cgroup; they are
# not limited separately.
[containers]
netns = "host"
userns = "host"
ipcns = "host"
utsns = "host"
cgroupns = "host"
cgroups = "disabled"
log_driver = "k8s-file"
[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
