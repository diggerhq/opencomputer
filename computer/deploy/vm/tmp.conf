# Installed by deploy/vm/provision.sh as /etc/tmpfiles.d/tmp.conf.
# Runners share TMPDIR=/tmp (src/host/launch.ts), and Ubuntu's 30 days left
# 44 GB there on a 61 GB root disk. Same name as /usr/lib/tmpfiles.d/tmp.conf,
# so this file replaces it (its one line was `D /tmp 1777 root root 30d`).
#
# D as Ubuntu has it: emptied at boot as before, mode and owner unchanged.
# Entries untouched (atime, mtime, and ctime for non-directories) for 7 days
# go when systemd-tmpfiles-clean.timer runs (daily). A directory goes only once
# it is empty and itself old: anything recent inside keeps it.
D /tmp 1777 root root 7d

# The host's own: Slack attachments a session may still read (src/runner/attachments.ts).
x /tmp/slack-presence
# Other services' private /tmp and desktop sockets; their packages age them.
x /tmp/systemd-private-*
x /tmp/snap-private-tmp
x /tmp/.X11-unix
x /tmp/.ICE-unix
x /tmp/.XIM-unix
x /tmp/.font-unix
x /tmp/.Test-unix
