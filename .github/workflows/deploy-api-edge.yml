# One-time branch-only migration helper. Do not merge this workflow revision.
#
# Before dispatching, configure the temporary Infisical identity's OIDC auth
# with this exact GitHub claim and grant it write access only to production
# /api-edge:
#   subject:  repo:diggerhq/opencomputer:ref:refs/heads/feat/infisical-secret-relay
#   audience: https://github.com/diggerhq
name: One-Time Relay Production Secrets to Infisical

run-name: Relay production secrets to Infisical by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      infisical_identity_id:
        description: 'Temporary OIDC-enabled Infisical machine identity ID'
        required: true
        type: string
      infisical_project_id:
        description: 'Infisical project ID (UUID, not the project slug)'
        required: true
        default: 'ab6933b4-8e02-4cb8-ac6c-c178009d5bf5'
        type: string
      confirmation:
        description: 'Select RELAY to copy the four GitHub secrets'
        required: true
        default: CANCEL
        type: choice
        options:
          - CANCEL
          - RELAY

concurrency:
  group: one-time-production-secret-relay
  cancel-in-progress: false

jobs:
  relay:
    if: inputs.confirmation == 'RELAY'
    name: Relay to production /api-edge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    env:
      DO_NOT_TRACK: '1'
      INFISICAL_DISABLE_UPDATE_CHECK: '1'

    steps:
      - name: Install verified Infisical CLI
        env:
          INFISICAL_CLI_VERSION: 0.45.4
          INFISICAL_CLI_SHA256: 107389f4c9a0cc48023a834bb2a5bf1280c0a0e45ea7a98d13807d4def21b0a5
        run: |
          set -Eeuo pipefail
          archive="cli_${INFISICAL_CLI_VERSION}_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/infisical-cli"
          archive_path="$RUNNER_TEMP/$archive"

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive_path" \
            "https://github.com/Infisical/cli/releases/download/v${INFISICAL_CLI_VERSION}/$archive"
          printf '%s  %s\n' "$INFISICAL_CLI_SHA256" "$archive_path" | sha256sum --check --status

          mkdir -p "$install_dir"
          tar -xzf "$archive_path" -C "$install_dir" infisical
          test -x "$install_dir/infisical"
          printf 'INFISICAL_BIN=%s\n' "$install_dir/infisical" >> "$GITHUB_ENV"

      - name: Relay repository secrets without exposing values
        env:
          INFISICAL_IDENTITY_ID: ${{ inputs.infisical_identity_id }}
          INFISICAL_PROJECT_ID: ${{ inputs.infisical_project_id }}
          OC_MANAGED_CRED_HMAC_SECRET: ${{ secrets.OC_MANAGED_CRED_HMAC_SECRET }}
          AGENT_RUNTIME_USAGE_HMAC_SECRET: ${{ secrets.AGENT_RUNTIME_USAGE_HMAC_SECRET }}
          LOOPS_API_KEY: ${{ secrets.LOOPS_API_KEY }}
          SLACK_CONNECT_TOKEN: ${{ secrets.SLACK_CONNECT_TOKEN }}
        run: |
          set -Eeuo pipefail
          umask 077

          uuid_pattern='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          if [[ ! "$INFISICAL_IDENTITY_ID" =~ $uuid_pattern ]]; then
            echo 'infisical_identity_id must be a UUID' >&2
            exit 1
          fi
          if [[ ! "$INFISICAL_PROJECT_ID" =~ $uuid_pattern ]]; then
            echo 'infisical_project_id must be a UUID' >&2
            exit 1
          fi

          secret_names=(
            OC_MANAGED_CRED_HMAC_SECRET
            AGENT_RUNTIME_USAGE_HMAC_SECRET
            LOOPS_API_KEY
            SLACK_CONNECT_TOKEN
          )
          for secret_name in "${secret_names[@]}"; do
            secret_value="${!secret_name-}"
            if [[ -z "$secret_value" ]]; then
              printf 'Required GitHub secret %s is missing or empty\n' "$secret_name" >&2
              exit 1
            fi
          done

          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC request URL is unavailable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token is unavailable}"
          oidc_response="$(
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fgithub.com%2Fdiggerhq"
          )"
          oidc_jwt="$(jq --exit-status --raw-output '.value | strings | select(length > 0)' <<< "$oidc_response")"
          printf '::add-mask::%s\n' "$oidc_jwt"
          unset oidc_response

          infisical_token="$(
            INFISICAL_MACHINE_IDENTITY_ID="$INFISICAL_IDENTITY_ID" \
            INFISICAL_JWT="$oidc_jwt" \
            INFISICAL_DOMAIN='https://app.infisical.com' \
            "$INFISICAL_BIN" login --method=oidc-auth --silent --plain
          )"
          printf '::add-mask::%s\n' "$infisical_token"
          unset oidc_jwt

          # The CLI chooses its parser from the filename. A .yml symlink to
          # stdin lets jq serialize every value safely without writing a
          # plaintext secrets file or placing a value in a process argument.
          relay_input="$RUNNER_TEMP/infisical-relay-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.yml"
          ln -s /dev/stdin "$relay_input"
          jq --null-input '{
            OC_MANAGED_CRED_HMAC_SECRET: env.OC_MANAGED_CRED_HMAC_SECRET,
            AGENT_RUNTIME_USAGE_HMAC_SECRET: env.AGENT_RUNTIME_USAGE_HMAC_SECRET,
            LOOPS_API_KEY: env.LOOPS_API_KEY,
            SLACK_CONNECT_TOKEN: env.SLACK_CONNECT_TOKEN
          }' \
            | INFISICAL_TOKEN="$infisical_token" \
              INFISICAL_DOMAIN='https://app.infisical.com' \
              "$INFISICAL_BIN" secrets set \
                --file "$relay_input" \
                --projectId "$INFISICAL_PROJECT_ID" \
                --env prod \
                --path /api-edge \
                --type shared \
                >/dev/null

          unset infisical_token
          echo 'Relayed four production secrets to Infisical /api-edge.'
