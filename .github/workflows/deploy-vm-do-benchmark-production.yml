name: Deploy isolated VM-DO production benchmark

on:
  push:
    branches:
      - feat/vm-do-poc
    paths:
      - .github/workflows/deploy-vm-do-benchmark-production.yml
      - cloudflare-workers/vm-do-poc/**

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-workers/vm-do-poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare-workers/vm-do-poc/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Deploy isolated benchmark Worker
        run: npx wrangler deploy --config wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Set isolated benchmark credentials
        run: |
          printf '%s' "$BENCH_API_TOKEN" | npx wrangler secret put BENCH_API_TOKEN --config wrangler.production.jsonc
          printf '%s' "$VM_CONNECT_SECRET" | npx wrangler secret put VM_CONNECT_SECRET --config wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BENCH_API_TOKEN: ${{ secrets.OC_VM_DO_BENCH_API_TOKEN }}
          VM_CONNECT_SECRET: ${{ secrets.OC_VM_DO_CONNECT_SECRET }}
