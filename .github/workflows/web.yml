name: Web

# CI for web/ (the dashboard and the surface): ESLint, the TypeScript build
# check and the unit tests. web/ reads the TypeScript SDK's source through path
# aliases, so SDK changes run it too. Nothing here deploys, and no job has a
# secret.

on:
  pull_request:
    paths:
      - web/**
      - sdks/typescript/**
      - .github/workflows/web.yml
  push:
    branches: [main, tracks-and-threads]
    paths:
      - web/**
      - sdks/typescript/**
      - .github/workflows/web.yml

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: web

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            sdks/typescript/package-lock.json
      - run: npm ci --no-audit --no-fund
      # The typecheck and tests read the SDK's source, which imports its own dependencies.
      - name: The SDK's dependencies
        working-directory: sdks/typescript
        run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
