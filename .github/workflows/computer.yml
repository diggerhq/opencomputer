name: Computer

# CI for computer: `npm run check` (typecheck, lint, unit tests, file-size
# ratchet, boundaries, schemas, the runner bundle), the Slack-path timing
# check, the telemetry collector and Grafana JSON, and a secret scan. The
# integration checks in computer/src/dev/ (real processes, some need Claude
# credentials) are run by hand. Nothing here deploys, and no job has a secret.

on:
  pull_request:
    paths:
      - computer/**
      - .github/workflows/computer.yml
  push:
    branches: [main]
    paths:
      - computer/**
      - .github/workflows/computer.yml

permissions:
  contents: read

concurrency:
  group: computer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: computer

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: computer/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      # Did Slack get slower: the Slack path with the journal and an API client against none.
      - run: npm run perf-check

  selfhost:
    name: Self-host image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -f deploy/docker/Dockerfile --build-arg SP_VERSION=${GITHUB_SHA::7} -t computer:ci .
      # The gateway and the host come up in one container and the host connects; setup is reachable.
      - name: Start and wait for the host
        run: |
          docker run -d --name computer -p 8080:8080 computer:ci
          for i in $(seq 1 60); do
            curl -fsS localhost:8080/healthz | grep -q '"hosts":\["local"\]' && break
            sleep 2
          done
          docker logs computer 2>&1 | sed -E 's/token=[0-9a-f]+/token=<redacted>/'
          curl -fsS localhost:8080/healthz | grep '"hosts":\["local"\]'
          docker logs computer 2>&1 | grep -q 'localhost:8080/setup?token='
          docker exec computer test -s /data/instance.env
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/setup)" = 401

  collector:
    name: Telemetry collector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: computer/telemetry/collector
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: computer/telemetry/collector/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/collector"

  grafana:
    name: Grafana JSON
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node telemetry/grafana/render.mjs --check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: gitleaks
        run: |
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner
