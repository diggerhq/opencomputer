name: Publish OpenComputer packages

on:
  pull_request:
    paths:
      - "agent/**"
      - "react/**"
      - "cli/**"
      - "create-start/**"
      - "scripts/check-opencomputer-package-contract.mjs"
      - ".github/workflows/publish-opencomputer-packages.yml"
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "react/**"
      - "cli/**"
      - "create-start/**"
      - "scripts/check-opencomputer-package-contract.mjs"
      - ".github/workflows/publish-opencomputer-packages.yml"
  workflow_dispatch:

concurrency:
  group: publish-opencomputer-packages
  cancel-in-progress: false

jobs:
  publish:
    name: Test, build, and publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: |
            agent/package-lock.json
            react/package-lock.json
            cli/package-lock.json

      - name: Verify package version contract
        run: node scripts/check-opencomputer-package-contract.mjs

      - name: Install and build agent package
        working-directory: agent
        run: |
          npm ci
          npm run build

      - name: Install and test CLI package
        working-directory: cli
        run: |
          npm ci
          npm test

      - name: Install and build React package
        working-directory: react
        run: |
          npm ci
          npm run build

      - name: Install and test starter package
        working-directory: create-start
        env:
          OPENCOMPUTER_CREATE_START_MODULE_PATH: ${{ github.workspace }}/cli/dist/create-start.js
        run: |
          npm test

      - name: Publish packages in dependency order
        if: github.event_name != 'pull_request'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          publish_if_needed() {
            local directory="$1"
            local package_name="$2"
            local version
            local lookup

            version="$(node -p "require('./${directory}/package.json').version")"
            if lookup="$(npm view "${package_name}@${version}" version 2>&1)"; then
              echo "${package_name}@${version} is already published; skipping."
            elif [[ "${lookup}" == *"E404"* ]]; then
              echo "Publishing ${package_name}@${version}."
              (cd "${directory}" && npm publish --provenance --access public)
            else
              echo "npm registry lookup failed for ${package_name}@${version}; refusing to publish." >&2
              echo "${lookup}" >&2
              return 1
            fi
          }

          wait_for_package() {
            local directory="$1"
            local package_name="$2"
            local version
            version="$(node -p "require('./${directory}/package.json').version")"
            for attempt in $(seq 1 30); do
              if [[ "$(npm view "${package_name}@${version}" version 2>/dev/null || true)" == "${version}" ]]; then
                echo "${package_name}@${version} is visible on npm."
                return 0
              fi
              echo "Waiting for ${package_name}@${version} to propagate (${attempt}/30)…"
              sleep 2
            done
            echo "${package_name}@${version} did not become visible on npm." >&2
            return 1
          }

          publish_if_needed agent @opencomputer/agent
          wait_for_package agent @opencomputer/agent
          publish_if_needed react @opencomputer/react
          wait_for_package react @opencomputer/react
          publish_if_needed cli @opencomputer/cli
          wait_for_package cli @opencomputer/cli
          export OPENCOMPUTER_CREATE_START_MODULE_PATH="${PWD}/cli/dist/create-start.js"
          publish_if_needed create-start @opencomputer/create-start
